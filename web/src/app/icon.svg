<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Gemini icon outline</title>
  <desc id="desc">Icono estilo contorno sin relleno, conservando las superposiciones originales.</desc>
  <defs>
    <mask id="hide-face-and-body" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="200" height="200" fill="white"/>
      <circle cx="100" cy="102" r="31.5" fill="black"/>
      <circle cx="100" cy="136" r="41.5" fill="black"/>
    </mask>
    <mask id="hide-body" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="200" height="200" fill="white"/>
      <circle cx="100" cy="136" r="41.5" fill="black"/>
    </mask>
  </defs>

  <g fill="none" stroke="#422D1B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
    <g mask="url(#hide-face-and-body)">
      <polygon points="52,58 72,36 104,115 84,137" />
      <polygon points="148,58 128,36 96,115 116,137" />
    </g>

    <circle cx="100" cy="102" r="28" mask="url(#hide-body)"/>
    <circle cx="100" cy="136" r="38"/>
  </g>
</svg>
